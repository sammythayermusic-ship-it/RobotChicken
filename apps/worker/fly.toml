# Fly.io config for the payout worker. Deploy from the REPO ROOT:
#   fly deploy . --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile --ha=false
# --ha=false keeps it to ONE machine: once Phase 3 signs payouts there must be
# exactly one signer, and fly deploy otherwise adds a standby.
#
# No [http_service]: nothing on the internet reaches the worker. The machine
# check below hits /health over Fly's internal network.

app = "cockfight-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 60

[env]
  NODE_ENV = "production"
  PORT = "8080"
  SOLANA_CLUSTER = "mainnet-beta"
  # PUMP: fees arrive in it and players are paid in it.
  PAYOUT_MINT = "pumpCmXqMfrsAkQ5r49WcJnRayYRqmXz6ae8H7H9Dfn"
  LAUNCH_WALLET = "Hqwjp8NAc9hyFxN1XUJoMQLotUdQuagwM2EpEMqCSjpF"
  HOT_WALLET = "HXvSiWxbvFsV7Y8NLgK5jK537EarX6v3PCns5SQSLGV1"
  SEED_WALLET = "BGZx5Lti1gWY7yD55pMBePiCAUPN4sEJYrmGUuLDjWwX"
  CLAIM_EVERY_MIN = "1"
  # Per-launch values and keys live in Fly secrets: COCK_MINT, PAYOUTS_ENABLED,
  # HOT_WALLET_KEYPAIR, SEED_WALLET_KEYPAIR, COLD_WALLET, the guarantees, SUPABASE_*,
  # HELIUS_API_KEY, TELEGRAM_*.

[checks.alive]
  type = "http"
  port = 8080
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
